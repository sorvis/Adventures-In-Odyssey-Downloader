name: refresh-aio-catalog

# Weekly + manual trigger. Pulls a fresh AIO album catalog from
# fotf.my.site.com (anonymous endpoint, no auth needed) and opens a
# PR with the diff if anything changed. The bundled asset
# android/app/src/main/assets/aio_catalog.json is what powers
# in-app enrichment + the Albums browse view, so it stays useful only
# if it tracks the upstream as new albums air.

on:
  schedule:
    # Mondays 13:00 UTC — gives Monday-air new episodes time to land
    # in the upstream catalog before we scrape.
    - cron: "0 13 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: scrape + open PR if changed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run scraper
        run: scripts/aio-scrape-catalog.py

      - name: Detect changes
        id: diff
        run: |
          set -euo pipefail
          if git diff --quiet android/app/src/main/assets/aio_catalog.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "catalog unchanged — nothing to do"
          else
            ALBUMS=$(python3 -c "import json; print(json.load(open('android/app/src/main/assets/aio_catalog.json'))['albumCount'])")
            EPS=$(python3 -c "import json; d=json.load(open('android/app/src/main/assets/aio_catalog.json')); print(sum(len(a['episodes']) for a in d['albums']))")
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "summary=Albums: ${ALBUMS} • Episodes: ${EPS}" >> "$GITHUB_OUTPUT"
            echo "${ALBUMS} albums, ${EPS} episodes after scrape"
          fi

      - name: Open PR with the new catalog
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Refresh AIO catalog (${{ steps.diff.outputs.summary }})"
          title: "Refresh AIO catalog"
          body: |
            Automated weekly scrape from `apexrest/v1/contentgrouping/search`.

            ${{ steps.diff.outputs.summary }}

            Generated by `.github/workflows/refresh-catalog.yml`. Merge
            after eyeballing the diff is reasonable — the JSON is bundled
            into the next APK release and the Album browse view reads
            it directly.
          branch: chore/refresh-aio-catalog
          delete-branch: true
          add-paths: |
            android/app/src/main/assets/aio_catalog.json
