services:
  archive:
    build: .
    container_name: odyssey-archive
    restart: unless-stopped
    # Tell Docker NOT to load its `docker-default` AppArmor profile for
    # this container. Unprivileged LXCs on the Proxmox host can't manage
    # AppArmor profiles, so Docker's boot-time container-restore step
    # fails on apparmor_parser → containers don't auto-restart after a
    # host reboot, even with `restart: unless-stopped`. Setting
    # `lxc.apparmor.profile: unconfined` on the LXC config disables
    # confinement OF the container but does NOT let Docker load
    # profiles from inside the LXC; this per-service flag is the actual
    # fix. See feedback_apparmor_blocks_docker_in_ct121.md.
    security_opt:
      - apparmor=unconfined
    environment:
      ODYSSEY_AUTH_TOKEN: ${ODYSSEY_AUTH_TOKEN:?set ODYSSEY_AUTH_TOKEN in .env or run scripts/up.sh}
      ODYSSEY_DATA_DIR: /data
    volumes:
      # episodes.db + the import drop-folder live on the local rootfs
      # (SQLite WAL doesn't survive CIFS, and import is a staging dir).
      # Defaults to a sibling ./_data dir for local dev.
      - ${ODYSSEY_DATA_HOST_DIR:-./_data}:/data
      # Audio files are huge and need to live on the NAS. The second
      # bind layers over /data/audio so the container reads/writes the
      # CIFS-mounted catalog directly. On Proxmox/LXC export
      # ODYSSEY_AUDIO_HOST_DIR=/data/audio (the CIFS mount path inside
      # the LXC). For local dev it falls through to ./_data/audio so
      # nothing changes.
      - ${ODYSSEY_AUDIO_HOST_DIR:-./_data/audio}:/data/audio
    ports:
      - "${BIND_IP:-0.0.0.0}:${ODYSSEY_PORT:-8088}:8088"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/healthz').read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Optional Cloudflare Tunnel sidecar. Lives behind the `cloudflare`
  # profile so it only starts when scripts/up.sh sees a non-blank
  # CLOUDFLARED_TUNNEL_TOKEN (i.e. the operator has done the one-time
  # Cloudflare dashboard setup). Outbound-only — no inbound port
  # forwarding needed on the home router. LAN + Tailscale access to
  # `archive` above is unaffected; the tunnel is purely additive.
  #
  # Ingress (which public hostname → which container port) is configured
  # in the Cloudflare Zero Trust dashboard, not here, because the
  # token-based tunnel format pulls config from the control plane.
  # Point your tunnel's ingress at `http://archive:8088`.
  cloudflared:
    image: cloudflare/cloudflared:2024.10.0
    container_name: odyssey-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARED_TUNNEL_TOKEN:-}
    depends_on:
      - archive
    profiles:
      - cloudflare
