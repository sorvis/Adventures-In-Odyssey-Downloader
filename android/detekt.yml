# detekt config — kept minimal. We enable the `exceptions` ruleset
# (catches silent retry / swallowed-throwable patterns like the one
# that hid the YSH download failure in DownloadEpisodeWorker), and
# disable every other ruleset by default. As issues come up in code
# review the relevant rules can be re-enabled here.
build:
  maxIssues: 0

exceptions:
  active: true
  SwallowedException:
    # Strict mode (no ignoredExceptionTypes, no allowedExceptionNameRegex
    # escape hatch) so every `catch` that drops its throwable gets
    # surfaced. Reason: the YSH download retry loop bug was a swallow,
    # and any future swallow has the same risk of hiding a live
    # production failure. Genuine no-op catches (e.g. closing a stream
    # that's already closed) must reference the throwable somewhere —
    # even just `_ = e` — to make the intent explicit.
    active: true
  TooGenericExceptionCaught:
    active: false
  ThrowingExceptionsWithoutMessageOrCause:
    active: false
  InstanceOfCheckForException:
    active: false
  RethrowCaughtException:
    active: true

empty-blocks:
  active: true
  EmptyCatchBlock:
    active: true
  # The rest of empty-blocks fires on legitimate test stubs (no-op
  # `() -> Unit` lambdas, fake function objects). Leave them off so
  # the ruleset stays focused on the catch-eats-exception pattern.
  EmptyFunctionBlock:
    active: false
  EmptyClassBlock:
    active: false
  EmptyDefaultConstructor:
    active: false
  EmptyDoWhileBlock:
    active: false
  EmptyElseBlock:
    active: false
  EmptyFinallyBlock:
    active: false
  EmptyForBlock:
    active: false
  EmptyIfBlock:
    active: false
  EmptyInitBlock:
    active: false
  EmptyKtFile:
    active: false
  EmptySecondaryConstructor:
    active: false
  EmptyTryBlock:
    active: false
  EmptyWhenBlock:
    active: false

# Everything else off — we can opt rules back in deliberately.
complexity:
  active: false
style:
  active: false
naming:
  active: false
performance:
  active: false
potential-bugs:
  active: false
comments:
  active: false
coroutines:
  active: false
